name: Publish student materials
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate publication boundaries
        shell: python
        run: |
          from pathlib import Path
          root = Path('site')
          assert (root / 'index.html').is_file()
          for p in root.rglob('*'):
              assert not p.is_symlink(), p
              assert not any(x in {'runbook.html', 'script.html', 'plan.html', 'reviews', 'teacher-media', 'raw', '.env'} for x in p.parts), p
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
